openapi: 3.0.0
info:
  title: Smart Home Monolith API
  description: API for managing sensors in the smart home system.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local server

paths:
  /health:
    get:
      summary: Health check
      description: Checks the health of the service.
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/sensors:
    get:
      summary: Get all sensors
      description: Retrieves a list of all sensors. The temperature of temperature sensors is updated from the in-memory storage, which is populated by a Kafka consumer.
      responses:
        '200':
          description: A list of sensors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sensor'
    post:
      summary: Create a new sensor
      description: Adds a new sensor to the system.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorCreate'
      responses:
        '201':
          description: The created sensor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Bad request.

  /api/v1/sensors/{id}:
    get:
      summary: Get a sensor by ID
      description: Retrieves a single sensor by its ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A single sensor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '404':
          description: Sensor not found.
    put:
      summary: Update a sensor
      description: Updates the details of a sensor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SensorUpdate'
      responses:
        '200':
          description: The updated sensor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sensor'
        '400':
          description: Bad request.
        '404':
          description: Sensor not found.
    delete:
      summary: Delete a sensor
      description: Deletes a sensor from the system.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sensor deleted successfully.
        '404':
          description: Sensor not found.

  /api/v1/me:
    get:
      summary: Get current user ID
      description: Validates a Bearer token and returns the corresponding user ID.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The user ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    example: 1
        '401':
          description: Unauthorized.

  /api/v1/switchers:
    post:
      summary: Register a new switcher
      description: Registers a new switcher device for a user. After registration, a message is sent to Kafka.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitcherCreate'
      responses:
        '201':
          description: The created switcher.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Switcher'
        '400':
          description: Bad request.
        '500':
          description: Internal server error.

  /api/v1/sensors/{id}/value:
    patch:
      summary: Update a sensor's value
      description: Updates the value and status of a sensor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: number
                  format: float
                status:
                  type: string
              required:
                - value
                - status
      responses:
        '200':
          description: Sensor value updated successfully.
        '400':
          description: Bad request.
        '404':
          description: Sensor not found.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Switcher:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        user_id:
          type: integer
        created_at:
          type: string
          format: date-time

    SwitcherCreate:
      type: object
      properties:
        name:
          type: string
        user_id:
          type: integer
      required:
        - name
        - user_id

    Sensor:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum: [temperature, humidity, light]
        location:
          type: string
        value:
          type: number
          format: float
        status:
          type: string
        last_updated:
          type: string
          format: date-time

    SensorCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [temperature, humidity, light]
        location:
          type: string
      required:
        - name
        - type
        - location

    SensorUpdate:
      type: object
      properties:
        name:
          type: string
        location:
          type: string
