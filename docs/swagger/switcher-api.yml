openapi: 3.0.0
info:
  title: Switcher API
  description: API for managing switchers.
  version: 1.0.0

servers:
  - url: http://localhost:8082
    description: Local server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use the token obtained from the monolith (e.g., 'test-token').

security:
  - bearerAuth: []

paths:
  /switchers/{id}/on:
    post:
      summary: Turn a switcher on
      parameters:
        - name: id
          in: path
          required: true
          description: The device ID of the switcher.
          schema:
            type: integer
      responses:
        '200':
          description: Switcher turned on successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "on"
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden, user does not own this switcher.
        '404':
          description: Not Found.

  /switchers/{id}/off:
    post:
      summary: Turn a switcher off
      parameters:
        - name: id
          in: path
          required: true
          description: The device ID of the switcher.
          schema:
            type: integer
      responses:
        '200':
          description: Switcher turned off successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "off"
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden, user does not own this switcher.
        '404':
          description: Not Found.

  /switchers/{id}:
    get:
      summary: Get the current state of a switcher
      parameters:
        - name: id
          in: path
          required: true
          description: The device ID of the switcher.
          schema:
            type: integer
      responses:
        '200':
          description: The current state of the switcher.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "on"
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden, user does not own this switcher.
        '404':
          description: Not Found.
