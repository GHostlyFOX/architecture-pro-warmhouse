version: '3.8'

networks:
  smart_home_net:
    driver: bridge

services:
  # --- Databases ---
  monolith-db:
    image: postgres:16-alpine
    container_name: monolith-db
    restart: always
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart_home_net

  temperature-db:
    image: postgres:16-alpine
    container_name: temperature-db
    restart: always
    environment:
      POSTGRES_DB: temperature_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - ./temperature_api/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart_home_net

  # --- Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - smart_home_net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smart_home_net

  # --- Applications ---
  monolith:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: monolith
    restart: always
    depends_on:
      - monolith-db
      - kafka
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@monolith-db:5432/smarthome?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    networks:
      - smart_home_net

  temperature-api-nginx:
    image: nginx:latest
    container_name: temperature-api-nginx
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./temperature_api/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - temperature-api
    networks:
      - smart_home_net

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: temperature-api
    restart: always
    depends_on:
      - temperature-db
      - kafka
    environment:
      - DB_HOST=temperature-db
      - DB_PORT=5432
      - DB_NAME=temperature_db
      - DB_USER=user
      - DB_PASSWORD=password
      - KAFKA_BROKERS=kafka:9092
    networks:
      - smart_home_net