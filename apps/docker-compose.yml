version: '3.8'

networks:
  smart_home_net:
    driver: bridge

services:
  # --- Databases ---
  monolith-db:
    image: postgres:16-alpine
    container_name: monolith-db
    restart: always
    environment:
      POSTGRES_DB: smarthome
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d smarthome"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_home_net

  temperature-db:
    image: postgres:16-alpine
    container_name: temperature-db
    restart: always
    environment:
      POSTGRES_DB: temperature_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./temperature_api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d temperature_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_home_net

  switcher-db:
    image: postgres:16-alpine
    container_name: switcher-db
    restart: always
    environment:
      POSTGRES_DB: switcher_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./switcher-api/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d switcher_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_home_net

  # --- Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - smart_home_net

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - smart_home_net

  # --- Applications ---
  monolith-nginx:
    image: nginx:latest
    container_name: monolith-nginx
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./smart_home/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - monolith
    networks:
      - smart_home_net

  monolith:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: monolith
    restart: always
    depends_on:
      monolith-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - PORT=:8080
      - DATABASE_URL=postgres://user:password@monolith-db:5432/smarthome?sslmode=disable
      - KAFKA_BROKERS=kafka:9092
    networks:
      - smart_home_net

  switcher-api-nginx:
    image: nginx:latest
    container_name: switcher-api-nginx
    restart: always
    ports:
      - "8082:8082"
    volumes:
      - ./switcher-api/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - switcher-api
    networks:
      - smart_home_net

  switcher-api:
    build:
      context: ./switcher-api
      dockerfile: Dockerfile
    container_name: switcher-api
    restart: always
    depends_on:
      switcher-db:
        condition: service_healthy
      kafka:
        condition: service_started
      monolith:
        condition: service_started
    environment:
      - DB_HOST=switcher-db
      - DB_PORT=5432
      - DB_NAME=switcher_db
      - DB_USER=user
      - DB_PASSWORD=password
      - KAFKA_BROKERS=kafka:9092
      - MONOLITH_API_URL=http://monolith-nginx:8080
    networks:
      - smart_home_net

  switcher-consumer:
    build:
      context: ./switcher-api
      dockerfile: Dockerfile
    container_name: switcher-consumer
    restart: always
    command: php kafka_consumer.php
    depends_on:
      switcher-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - DB_HOST=switcher-db
      - DB_PORT=5432
      - DB_NAME=switcher_db
      - DB_USER=user
      - DB_PASSWORD=password
      - KAFKA_BROKERS=kafka:9092
    networks:
      - smart_home_net

  temperature-api-nginx:
    image: nginx:latest
    container_name: temperature-api-nginx
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./temperature_api/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - temperature-api
    networks:
      - smart_home_net

  temperature-api:
    build:
      context: ./temperature_api
      dockerfile: Dockerfile
    container_name: temperature-api
    restart: always
    depends_on:
      temperature-db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - DB_HOST=temperature-db
      - DB_PORT=5432
      - DB_NAME=temperature_db
      - DB_USER=user
      - DB_PASSWORD=password
      - KAFKA_BROKERS=kafka:9092
    networks:
      - smart_home_net